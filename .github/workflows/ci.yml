name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app-xray/package-lock.json

      - name: Build app-xray
        run: cd app-xray && npm ci && npm run build

      - name: Build xray-invoker
        run: cd lambda/xray-invoker && npm ci && npm run build

      - name: Build xray-dog-fetcher
        run: cd lambda/xray-dog-fetcher && npm ci && npm run build

      - name: Build xray-s3-writer
        run: cd lambda/xray-s3-writer && npm ci && npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: bash ci/docker_build.sh
