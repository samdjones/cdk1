name: Emulator test

# Deploys the CDK stacks into a local Floci AWS emulator and asserts on the
# result. Never touches real AWS. Runs on every push/PR and can be dispatched
# manually. See x-ray/docs/emulator-test.md.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      stack:
        description: "Which demo to test"
        type: choice
        options: [all, alb, x-ray]
        default: all

jobs:
  emulator-test-alb:
    if: inputs.stack == null || inputs.stack == 'all' || inputs.stack == 'alb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Emulator test (alb)
        run: bash alb/ci/emulator_test.sh

  emulator-test-xray:
    if: inputs.stack == null || inputs.stack == 'all' || inputs.stack == 'x-ray'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Emulator test (x-ray)
        run: bash x-ray/ci/emulator_test.sh
